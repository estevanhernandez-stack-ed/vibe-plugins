name: tests

# Offline unit tests for the repo's own scripts (stdlib unittest, no installs).
# Covers the marketplace gate's decision logic and the committed manifest's
# shape rules; the networked gate itself lives in marketplace-gate.yml.
on:
  pull_request:
    paths:
      - ".claude-plugin/marketplace.json"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - ".claude-plugin/marketplace.json"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unit:
    name: Script unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
