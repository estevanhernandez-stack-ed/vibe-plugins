name: marketplace sync

# Fails if README.md drifts from .claude-plugin/marketplace.json — a plugin in the
# manifest with no storefront row, a stale install line, or an out-of-sync install
# block. The manifest is the source of truth; the README must follow it.
on:
  pull_request:
    paths:
      - ".claude-plugin/marketplace.json"
      - "README.md"
      - "scripts/gen-readme-plugins.mjs"
  push:
    branches: [main]
    paths:
      - ".claude-plugin/marketplace.json"
      - "README.md"
      - "scripts/gen-readme-plugins.mjs"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: README in sync with manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Read-only job: don't leave the token in .git/config for later steps.
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Check README against marketplace.json
        run: node scripts/gen-readme-plugins.mjs --check
